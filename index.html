<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="一个动态歌词播放器，支持 AI 主题生成" />
    <meta name="theme-color" content="#09090b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Folia" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>Folia</title>
    <script src="/runtime-config.js"></script>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "framer-motion": "https://aistudiocdn.com/framer-motion@^12.23.24",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "react-i18next": "https://aistudiocdn.com/react-i18next@^16.3.5",
    "i18next": "https://aistudiocdn.com/i18next@^25.6.3",
    "i18next-browser-languagedetector": "https://aistudiocdn.com/i18next-browser-languagedetector@^8.2.0"
  }
}
</script>
    <!-- 开屏词标的字体与动画在 src/appSplash.css：<link> 是渲染阻塞资源，样式必然先于首帧就绪，
         所以不必内联；字体请求也因此和 HTML 一起出发，不等 index.css 与 JS bundle。
         这里只留底色，保证任何情况下都不会先闪一帧白。 -->
    <link rel="stylesheet" href="/src/appSplash.css" />
    <style>
      html,
      body {
        background-color: #09090b;
      }
    </style>
</head>
  <body>
    <div id="app-splash" role="status" aria-live="polite" aria-label="Acretiondisk's Folia Player">
      <div class="app-splash-title">
        <span class="app-splash-owner">Acretiondisk's</span>
        <span class="app-splash-product">Folia Player</span>
      </div>
    </div>
    <script>
      (function () {
        var splash = document.getElementById('app-splash');

        // 需要透明背景的入口不能盖遮罩：OBS 浏览器源会被直接推流捕获，
        // Electron 的透明播放背景 / 壁纸窗口（main.cjs 传 splash=0）会在桌面上闪一个黑块。
        try {
          var params = new URLSearchParams(window.location.search);
          if (params.get('obs') === '1' || window.location.pathname === '/obs' || params.get('splash') === '0') {
            if (splash) {
              splash.remove();
            }
            return;
          }
        } catch (error) {
          // 探测失败时保留遮罩，React 挂载后仍会移除它。
        }

        if (!splash) {
          return;
        }

        // 遮罩出现的时刻。React 侧（src/utils/appSplash.ts）用它算「浮现 + 停留」还剩多久：
        // 没有它，秒挂载的构建会把词标在浮现途中就摘掉。
        splash.dataset.shownAt = String(Math.round(performance.now()));

        // 词标等 Anthropic Serif 真正可用再浮现。字体没到就先保持透明，免得兜底字形先淡进来、
        // 字体到了再跳一次。加载失败同样往下走（那时只能用兜底字形），超时兜底保证不会无限等。
        var FONT_WAIT_LIMIT_MS = 1000;

        var reveal = function () {
          if (!splash.isConnected || splash.classList.contains('is-revealing')) {
            return;
          }
          splash.classList.add('is-revealing');
          splash.dataset.revealAt = String(Math.round(performance.now()));
        };

        window.setTimeout(reveal, FONT_WAIT_LIMIT_MS);
        try {
          if (document.fonts && document.fonts.load) {
            document.fonts.load('800 100px "Folia Splash Serif"').then(reveal, reveal);
          } else {
            reveal();
          }
        } catch (error) {
          reveal();
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
